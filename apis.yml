name: '@Home Network'
description: '@Home Network (Excite@Home) was a pioneering residential broadband internet
  service provider founded in 1995, backed by venture firm Kleiner Perkins Caufield & Byers
  and cable operator TCI. It delivered high-speed cable internet access to consumers and merged
  with the Excite web portal in 1999 to form Excite@Home. The company filed for Chapter 11 bankruptcy
  on October 1, 2001 and ceased operations by February 2002; it is defunct and operates no website,
  developer portal, or API today. This record is retained as a historical portfolio-company profile
  and has no live surface to enrich.'
